[package]
name = "chameleonx"
version = "1.0.7"
description = "變色龍指紋瀏覽器 (ChameleonX)"
authors = ["ChameleonX Team"]
license = ""
repository = "https://github.com/pialboo/ChameleonX.git"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
open = "5"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
