<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 256px;
      height: 256px;
      background: transparent;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-container {
      width: 240px;
      height: 240px;
      background: linear-gradient(135deg, #181d24, #0c0e12);
      border-radius: 52px;
      border: 3px solid #262f3c;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    svg {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

</html>
